{% extends "user/base.html" %}

{% block title %}View Marks{% endblock %}

{% block body %}
<div class="min-h-[85vh] bg-gray-50 flex items-center justify-center p-4 font-sans">
    
    
    <div class="w-full max-w-md bg-white rounded-2xl shadow-md border border-gray-100 p-8 sm:p-10">
        
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight mb-2">
                View Marks
            </h1>
            <p class="text-gray-500 text-sm">Select the stream, subject, and term to check records.</p>
        </div>

        
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Class Stream</label>
                <div class="relative">
                    <select name="stream" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-green-500 focus:border-green-500 block p-3 appearance-none cursor-pointer transition-colors">
                        <option value="" disabled selected>Select a stream...</option>
                        {% for stream in streams %}
                            <option value="{{stream.id}}">{{stream.grade}} - {{stream.stream_name}}</option>
                        {% endfor %}
                    </select>
                    
                    <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
            </div>

            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Subject</label>
                <div class="relative">
                    <select name="subject" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-green-500 focus:border-green-500 block p-3 appearance-none cursor-pointer transition-colors">
                        <option value="" disabled selected>Select a subject...</option>
                        {% for subject in subjects %}
                            <option value="{{subject.id}}">{{subject.subject_name}}</option>
                        {% endfor %}
                    </select>
                    
                    <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
            </div>

            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Exam Term</label>
                <div class="relative">
                    <select name="exam_term" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-green-500 focus:border-green-500 block p-3 appearance-none cursor-pointer transition-colors">
                        <option value="" disabled selected>Select a term...</option>
                        {% for value, label in exam_terms %}
                            <option value="{{value}}">{{label}}</option>
                        {% endfor %}
                    </select>
                    
                    <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
            </div>

            
            <div class="pt-4 flex flex-col gap-3">
                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
                    Check Marks
                </button>
                
                <a href="{% url 'dashboard' %}" class="w-full text-center text-gray-500 hover:text-gray-800 font-semibold text-sm transition mt-1">
                    Cancel & Go Back
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
