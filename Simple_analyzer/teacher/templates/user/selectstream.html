{% extends "user/base.html" %}

{% block title %}Select Stream{% endblock %}

{% block body %}
<div class="min-h-[85vh] bg-gray-50 flex items-center justify-center p-4 font-sans">
    
    
    <div class="w-full max-w-md bg-white rounded-2xl shadow-md border border-gray-100 p-8 sm:p-10">
        
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight mb-2">
                Select Stream
            </h1>
            <p class="text-gray-500 text-sm">Choose a class to start recording marks.</p>
        </div>

        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            
            <div class="relative">
                <label for="stream" class="block text-sm font-semibold text-gray-700 mb-2">
                    Class Stream
                </label>
                
                <select name="stream" id="stream" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-xl focus:ring-green-500 focus:border-green-500 block p-3.5 appearance-none cursor-pointer">
                    <option value="" disabled selected>Select a stream...</option>
                    {% for stream in streams %}
                        
                        <option value="{{stream.id}}">{{stream.grade}} - {{stream.stream_name}}</option>
                    {% endfor %}
                </select>
                
                
                <div class="pointer-events-none absolute right-4 top-9.5 bottom-0 flex items-center text-gray-500">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
            </div>
            
            
            <div class="flex flex-col gap-3 pt-4">
                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
                    Continue & Add Marks
                </button>
                
                
                <a href="{% url 'dashboard' %}" class="w-full text-center text-gray-500 hover:text-gray-800 font-semibold text-sm transition mt-2">
                    Cancel & Go Back
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
