{% extends "user/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}
     
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans">
    
    
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 sm:p-10">
        
        <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-8 tracking-tight">
            Login
        </h2>
        
         
        <form method="POST" novalidate class="space-y-4">
            {% csrf_token %}
            
            
            {{ form|crispy }}
            
            <div class="pt-4">
        
                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
                    Login
                </button>
            </div>
        </form>
        
       

    </div>
</div>
{% endblock %}
